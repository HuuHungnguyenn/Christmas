<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06080e">
  <title>Cây thông Noel ASCII</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./tree.js" defer></script>
</head>
<body>
  <main class="scene">
    <canvas id="tree" width="792" height="1110" role="img"
      aria-label="Cây thông Noel ASCII xoay 3D với tuyết, đèn nhấp nháy và quà. Merry Christmas 2026!">
      Cây thông Noel ASCII. Merry Christmas 2026!
    </canvas>
    <div class="controls">
      <button id="pause" type="button">Tạm dừng</button>
      <button id="replay" type="button">Phát lại từ đầu</button>
    </div>
    <noscript>Bật JavaScript để xem cây thông chuyển động.</noscript>
  </main>
</body>
</html>
